# Apache configuration for the Kalulu language pack checker.
#
# Deployed copy lives at:
#   /opt/bitnami/apache/conf/vhosts/lang-tester.conf
# on the excello-multisite-main Lightsail instance. Kept in the repository so
# it is not something that exists only on one server.
#
# It is a config file rather than a .htaccess because that instance runs
# AllowOverride None, which makes .htaccess files silently do nothing.
# Bitnami includes vhosts/*.conf by design, so this survives WordPress and
# Bitnami updates.
#
# See HOW-TO-UPLOAD.md for the full procedure.

<Directory "/opt/bitnami/wordpress/lang-tester">
    Options -Indexes +FollowSymLinks -MultiViews

    # Serve this only under kalulu.excellolab.org. This is a WordPress Multisite
    # install, so every site in the network shares one document root: without
    # this line the folder answers on every domain pointed at the instance —
    # excellolab.org/lang-tester, and the bare IP address too. Anything else
    # gets 403.
    #
    # For more than one host, use a list:
    #   Require expr "tolower(%{HTTP_HOST}) in {'a.example.org', 'b.example.org'}"
    Require expr "tolower(%{HTTP_HOST}) == 'kalulu.excellolab.org'"

    # WordPress's front controller must not claim this folder.
    <IfModule mod_rewrite.c>
        RewriteEngine Off
    </IfModule>

    # Without this the browser refuses to stream-compile the engine and the
    # page stays blank.
    AddType application/wasm .wasm

    # 49 MB of engine becomes roughly 11 MB on the wire.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/wasm application/javascript text/html text/css
    </IfModule>

    <IfModule mod_headers.c>
        # Every file Godot's web export emits has a fixed name — index.html,
        # index.pck, index.js, index.wasm, index.side.wasm — with no content
        # hash and no version query. So "cache the engine, never cache
        # index.html" does not work, and used to: index.html is only a
        # bootstrapper, and the application itself is index.pck. Giving these a
        # freshness window means a returning tester keeps running whichever
        # build they first loaded until it lapses — and every visit re-arms the
        # window, so the testers who look most often are the last to see a
        # deployment. A 7-day window here left a tester on a three-week-old
        # build that still told them to fetch packs from GitHub by hand.
        #
        # no-cache does not mean "do not store", it means "revalidate before
        # use". The files stay in the browser cache and Apache answers an
        # unchanged one with a 304 of a few hundred bytes, so the 44 MB engine
        # is not re-downloaded on every visit — only when it really changed.
        # One conditional request per file is the entire cost.
        <FilesMatch "\.(html|wasm|pck|js)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>

        # …but only with this line, and it is not optional here.
        #
        # mod_deflate appends "-gzip" to the ETag of anything it compresses, and
        # then core httpd compares the client's If-None-Match against the file's
        # unsuffixed ETag, which of course never matches. Revalidating the
        # engine would answer 200 with all 10.5 MB of it, every single visit —
        # turning the fix above into a bandwidth regression rather than a
        # neutral trade. Stripping the suffix on the way in restores the match,
        # and mod_deflate puts it back on the 304. Measured: 304 with 0 bytes.
        RequestHeader edit "If-None-Match" '^"((.*)-(gzip|br))"$' '"$2"'
    </IfModule>
</Directory>
