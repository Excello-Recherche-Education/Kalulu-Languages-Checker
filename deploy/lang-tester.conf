# Apache configuration for the Kalulu language pack checker.
#
# Deployed copy lives at:
#   /opt/bitnami/apache/conf/vhosts/lang-tester.conf
# on the excello-multisite-main Lightsail instance. Kept in the repository so
# it is not something that exists only on one server.
#
# It is a config file rather than a .htaccess because that instance runs
# AllowOverride None, which makes .htaccess files silently do nothing.
# Bitnami includes vhosts/*.conf by design, so this survives WordPress and
# Bitnami updates.
#
# See HOW-TO-UPLOAD.md for the full procedure.

<Directory "/opt/bitnami/wordpress/lang-tester">
    Options -Indexes +FollowSymLinks -MultiViews

    # Serve this only under kalulu.excellolab.org. This is a WordPress Multisite
    # install, so every site in the network shares one document root: without
    # this line the folder answers on every domain pointed at the instance —
    # excellolab.org/lang-tester, and the bare IP address too. Anything else
    # gets 403.
    #
    # For more than one host, use a list:
    #   Require expr "tolower(%{HTTP_HOST}) in {'a.example.org', 'b.example.org'}"
    Require expr "tolower(%{HTTP_HOST}) == 'kalulu.excellolab.org'"

    # WordPress's front controller must not claim this folder.
    <IfModule mod_rewrite.c>
        RewriteEngine Off
    </IfModule>

    # Without this the browser refuses to stream-compile the engine and the
    # page stays blank.
    AddType application/wasm .wasm

    # 49 MB of engine becomes roughly 11 MB on the wire.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/wasm application/javascript text/html text/css
    </IfModule>

    <IfModule mod_headers.c>
        # The engine files change only when a new build is uploaded.
        <FilesMatch "\.(wasm|pck|js)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>
        # index.html must not be cached, or testers keep running the old build.
        <FilesMatch "^index\.html$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>
</Directory>
